[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smallaxe"
dynamic = ["version"]
description = "A PySpark MLOps library for simplified model training and optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8,<3.13"
authors = [
    {name = "Henok Yemam"}
]
keywords = ["pyspark", "mlops", "machine-learning", "spark", "xgboost", "lightgbm", "catboost"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Exactly what smallaxe imports at runtime, directly or through the PySpark modules it
# imports. Each has a ">=" floor: the test-lowest CI job installs every floor exactly.
dependencies = [
    "pyspark>=3.3,<4.0",
    # smallaxe catches py4j's Py4JJavaError; PySpark 3.3.0 pins py4j 0.10.9.5.
    "py4j>=0.10.9.5",
    # Imported by smallaxe.search and by pyspark.ml. 1.17.3: the first release with
    # Python 3.8 wheels, and it has numpy.random.default_rng.
    "numpy>=1.17.3",
    # pyspark.ml.functions (vector_to_array) imports pandas from PySpark 3.4.
    "pandas>=1.0.0",
    "hyperopt>=0.2.7",
    # PySpark 3.x imports distutils, which Python 3.12 removed; setuptools provides it.
    "setuptools>=68; python_version >= '3.12'",
]

[project.optional-dependencies]
xgboost = [
    "xgboost>=1.7.0",
    # xgboost.spark imports scikit-learn and pandas (xgboost's own pandas floor is 1.2)
    # and runs its pandas UDFs through pyarrow.
    "scikit-learn>=1.0",
    "pandas>=1.2",
    "pyarrow>=4.0",
]
lightgbm = [
    "lightgbm>=3.3.0",
    "synapseml>=1.0.0",
]
catboost = [
    "catboost>=1.1.0",
]
# Visualization (smallaxe.viz) lands in a later release; nothing imports plotly yet.
viz = [
    "plotly>=5.0.0",
]
all = [
    "smallaxe[xgboost]",
    "smallaxe[lightgbm]",
    "smallaxe[catboost]",
    "smallaxe[viz]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-spark>=0.6.0",
    # Exact pins: CI lints and type-checks with these versions. black 26 and mypy 2
    # need Python 3.10+.
    "black==26.10.0; python_version >= '3.10'",
    "ruff==0.16.10",
    "mypy==2.4.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/henokyemam/smallaxe"
Repository = "https://github.com/henokyemam/smallaxe"
Issues = "https://github.com/henokyemam/smallaxe/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["smallaxe*"]

[tool.setuptools.package-data]
smallaxe = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
# mypy 2.x checks Python 3.10 and later only; the code stays 3.8-compatible (ruff's
# target-version and the test-lowest CI job on Python 3.8 hold that).
python_version = "3.10"
files = ["smallaxe"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Imported directly but untyped: hyperopt and py4j ship no stubs or py.typed, and
# catboost_spark (a JVM package's Python half) is not installed where the check runs.
# SynapseML and xgboost.spark are resolved from strings at runtime, so mypy never sees them.
module = ["hyperopt", "hyperopt.*", "py4j", "py4j.*", "catboost_spark"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
# A DeprecationWarning raised from one of smallaxe's own modules (for example smallaxe
# calling a deprecated PySpark API) fails the test that triggered it; third-party
# packages' internal deprecations stay warnings. smallaxe attributes its own warnings to
# the caller, so tests/test_removed.py checks separately that it emits none.
filterwarnings = [
    'error::DeprecationWarning:smallaxe(\..*)?$',
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
