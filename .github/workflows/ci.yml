name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # publish.yml calls this workflow so that a release is built only from a commit that
  # passes every job below.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run for the commit it replaces. Pushes to
  # main and release runs (called from publish.yml) are never cancelled.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # black and ruff are pinned to exact versions in the dev extra.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          ruff check smallaxe tests
          black --check smallaxe tests

  # The supported matrix: every (Python, Spark) pair that PySpark itself supports, per
  # the Python classifiers of each PySpark release on PyPI. PySpark 3.3 does not
  # support Python 3.11; no PySpark 3.x release supports Python 3.12.
  # Java: Spark 3.3-3.5 run on Java 8, 11 and 17. Java 11 runs everywhere; Java 8 runs
  # with the oldest Spark line and Java 17 with the newest.
  test:
    name: test (py${{ matrix.python-version }}, spark ${{ matrix.spark-version }}, java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        spark-version: ["3.3", "3.4", "3.5"]
        java-version: ["11"]
        exclude:
          - python-version: "3.11"
            spark-version: "3.3"
        include:
          - python-version: "3.10"
            spark-version: "3.3"
            java-version: "8"
          - python-version: "3.10"
            spark-version: "3.5"
            java-version: "17"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java-version }}

      - name: Install dependencies
        # "~=3.3.0" installs the latest 3.3.x patch release.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pyspark~=${{ matrix.spark-version }}.0"
          pip list

      - name: Run tests
        run: |
          pytest tests/ -v
        env:
          SPARK_VERSION: ${{ matrix.spark-version }}

  # Every runtime dependency at the floor declared in pyproject.toml, on the oldest
  # supported Python and the oldest PySpark release.
  test-lowest:
    name: test (lowest versions, py3.8, pyspark 3.3.0, java 11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Pin runtime dependencies to their floors
        # Turns each "name>=floor" in [project] dependencies into "name==floor", so this
        # job follows pyproject.toml. A dependency without a ">=" floor fails the job.
        run: |
          python - <<'EOF' > floors.txt
          import re

          text = open("pyproject.toml").read()
          block = re.search(r"^dependencies = \[(.*?)^\]", text, re.S | re.M).group(1)
          for spec in re.findall(r'"([^"]+)"', block):
              match = re.match(r"([A-Za-z0-9_.-]+)\s*>=\s*([^,;\s]+)", spec)
              if match is None:
                  raise SystemExit("no >= floor in dependency: " + spec)
              print(match.group(1) + "==" + match.group(2))
          EOF
          cat floors.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r floors.txt
          pip list

      - name: Run tests
        run: |
          pytest tests/ -v
        env:
          SPARK_VERSION: "3.3"

  # Optional-algorithm job: XGBoost is the one boosted algorithm that runs on a plain
  # Linux runner (LightGBM and CatBoost need JVM packages and are validated on Databricks).
  test-xgboost:
    name: test-xgboost (py3.10, spark ${{ matrix.spark-version }}, java 11)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark-version: ["3.3", "3.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,xgboost]" "pyspark~=${{ matrix.spark-version }}.0"
          pip list

      - name: Run tests
        run: |
          pytest tests/ -v
        env:
          SPARK_VERSION: ${{ matrix.spark-version }}
